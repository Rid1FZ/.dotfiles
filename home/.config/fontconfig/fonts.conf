<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!-- English: Ubuntu Nerd Font; Bengali falls through to Li Ador Noirrit -->
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Ubuntu Nerd Font</family>
   <family>Li Ador Noirrit</family>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <family>Ubuntu Nerd Font</family>
   <family>Li Ador Noirrit</family>
   <family>Noto Color Emoji</family>
  </prefer>
 </alias>
 <!-- Monospace: JetBrainsMono Nerd Font Mono, then icons, Bengali, emoji -->
 <match target="pattern">
  <test name="family" qual="first">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>JetBrainsMono Nerd Font</string>
   <string>Symbols Nerd Font</string>
   <string>Li Ador Noirrit</string>
   <string>Noto Color Emoji</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
</fontconfig>
